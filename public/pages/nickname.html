<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <a href="/pages/favorites.html" data-nav>Favorites</a>
      <a href="/pages/settings.html" data-nav>Settings</a>
    </div>
  </nav>

  <div class="app-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="/" data-nav><span class="icon">🏠</span>Home</a>
        <a href="/pages/explorer.html" data-nav><span class="icon">🔍</span>Explorer</a>

        <a href="/pages/inspector.html" data-nav><span class="icon">🔬</span>Inspector</a>

        <h1 class="page-title">Nickname Generator</h1>
        <p class="page-subtitle">Generate hundreds of decorated nickname styles. Click any nickname to copy.</p>
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap">

          <button id="nickname-generate" class="btn btn-primary">Generate</button>
          <span id="nickname-count" class="badge" style="align-self:center">0</span>
        </div>
        <div id="nickname-output"></div>
      </div>
    </main>
